project_name: "Ace Narrative Resolver"
tagline: "Hidden five-outcome action resolution for aviation and combat roleplay."
visibility: 'PRIVATE'
position: 'NONE'
tags:
  - 'RPG'
  - 'Combat'
  - 'Aviation'
  - 'Roleplay'
  - 'Stage'

config_schema:
  type: object
  title: Ace Narrative Resolver
  description: >-
    Scores use 0-5: 0 Untrained, 1 Novice, 2 Competent, 3 Veteran,
    4 Elite, 5 Ace. The stage automatically chooses the most relevant ability
    from the user's action, rolls a five-degree narrative outcome, and injects
    it as hidden stage directions for the model.
  properties:
    airmanship:
      type: integer
      title: Airmanship
      description: General aircraft handling, formation, navigation, takeoff/landing, terrain flying and recovery.
      minimum: 0
      maximum: 5
      default: 3
    combat:
      type: integer
      title: Combat Maneuvering
      description: BFM, energy management, reversals, pursuit geometry, missile evasion and positional fighting.
      minimum: 0
      maximum: 5
      default: 3
    weapons:
      type: integer
      title: Weapons
      description: Guns, missiles, bombs, rockets, release timing, firing solutions and attack runs.
      minimum: 0
      maximum: 5
      default: 3
    awareness:
      type: integer
      title: Situational Awareness
      description: Visual scan, threat detection, radar picture, tracking contacts and maintaining the tactical picture.
      minimum: 0
      maximum: 5
      default: 3
    systems:
      type: integer
      title: Systems
      description: Radar, ECM, sensors, datalink, navigation equipment, countermeasures and damaged aircraft systems.
      minimum: 0
      maximum: 5
      default: 2
    analysis:
      type: integer
      title: Analysis
      description: Tactical reasoning, prediction, geometry, route selection and reading an opponent's behavior.
      minimum: 0
      maximum: 5
      default: 3
    intelligence:
      type: integer
      title: Intelligence
      description: Technical knowledge, memory, engineering, problem solving and improvisation.
      minimum: 0
      maximum: 5
      default: 2
    reflexes:
      type: integer
      title: Reflexes
      description: Split-second reactions, sudden evasions and responding to unexpected threats.
      minimum: 0
      maximum: 5
      default: 3
    composure:
      type: integer
      title: Composure
      description: Focus, stress resistance, remaining functional under fire and resisting panic or disorientation.
      minimum: 0
      maximum: 5
      default: 3
    physique:
      type: integer
      title: Physique
      description: G tolerance, endurance, injury resistance and strenuous physical actions after ejection or on the ground.
      minimum: 0
      maximum: 5
      default: 3
    difficultyBias:
      type: integer
      title: Difficulty Bias
      description: Global difficulty adjustment. -1 easier, 0 normal, +1 harder.
      minimum: -1
      maximum: 1
      default: 0
    triggerSensitivity:
      type: integer
      title: Action Detection Sensitivity
      description: >-
        Controls how readily prose triggers a resolution. 1 = Very Low (only very explicit actions),
        2 = Low, 3 = Normal, 4 = High, 5 = Very High (even lightly implied actions may trigger).
        Raise this if the resolver misses actions; lower it if ordinary narration causes unwanted rolls.
      minimum: 1
      maximum: 5
      default: 3
    debugVisible:
      type: boolean
      title: Show Resolver Debug Message
      description: If enabled, show the chosen ability, difficulty, roll and outcome as a visible system message. Leave off for fully hidden resolution.
      default: false
  required: []

state_schema:
  message:
    type: object
    properties:
      lastResolution:
        type: object

github_path: 'https://github.com/WeirdnessUnfolds/theelectricstate'

